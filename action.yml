name: status-comment
description: Install the status-comment CLI, which keeps a pull request comment up to date with a job's steps
branding:
  icon: message-square
  color: blue

inputs:
  version:
    description: Release to install, e.g. v0.1.0. Defaults to the tag this action is used at, or the latest release.
    default: ""
  finalize:
    description: Run `status-comment finalize` at the end of the job, even when it fails. Set to false to finalize yourself.
    default: "true"

runs:
  using: node24
  main: action/install.js
  post: action/finalize.js
  post-if: always()
