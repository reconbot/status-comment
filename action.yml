name: status-comment
description: Install the status-comment CLI, which keeps a pull request comment up to date with a job's steps
branding:
  icon: message-square
  color: blue

inputs:
  config-path:
    description: A config JSON file to load with `status-comment config load`.
    default: ""
  token:
    description: GitHub token saved to the config with `status-comment config set token=…`, after any `config-path` is loaded. Used by every later call, including finalize.
    default: ""
  finalize:
    description: Run `status-comment finalize` at the end of the job, even when it fails. Set to false to finalize yourself.
    default: "true"

runs:
  using: node24
  main: action/install.js
  post: action/finalize.js
  post-if: always()
